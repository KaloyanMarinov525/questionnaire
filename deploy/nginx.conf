server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite's hashed build output never changes, so browsers can keep it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point is always revalidated, so a new deploy shows up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (TanStack Router): any unknown path loads the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
