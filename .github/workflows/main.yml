name: Deploy to Production

run-name: Deploy ${{ github.ref_name }} by ${{ github.actor }}

# Tests, then builds the site into an nginx image on GitHub's runner and pushes it to GHCR.
# The self-hosted x64 server pulls that image and restarts the container (questionnaire.kalstack.com).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Deploy:
    needs: Build
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deploy files
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker compose -p questionnaire -f deploy/docker-compose.yml pull
          docker compose -p questionnaire -f deploy/docker-compose.yml up -d
          docker image prune -f
